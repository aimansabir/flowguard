[project]
name = "flowguard-sim"
version = "0.2.0"
description = "SUMO harness for FlowGuard: network, demand, observer, signals, experiments, metrics"
requires-python = ">=3.12"
dependencies = [
    "flowguard-contracts",
    "flowguard-core",
    "eclipse-sumo==1.28.0",
    "traci==1.28.0",
    "sumolib==1.28.0",
]

[tool.uv.sources]
flowguard-contracts = { workspace = true }
flowguard-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
