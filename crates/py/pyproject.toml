[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "flowguard-core"
version = "0.2.0"
description = "FlowGuard decision core (Rust) for Python"
requires-python = ">=3.12"

[tool.maturin]
module-name = "flowguard_core"

[tool.uv]
# rebuild the extension whenever the Rust sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../core/Cargo.toml" },
    { file = "../core/src/**/*.rs" },
]
